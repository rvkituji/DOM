<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="index.js" defer></script>
  </head>

  <body
    class="min-h-screen min-w-[1000px] bg-[#101b16] font-sans text-[#f0fdf4]"
  >
    <div class="mx-auto flex min-h-screen w-[920px] flex-col">
      <header
        class="flex h-24 shrink-0 items-center justify-between border-b border-[#86efac]/10"
      >
        <nav>
          <a
            href="../index.html"
            class="inline-flex items-center gap-2 rounded-full border border-[#86efac]/15 bg-white/5 px-4 py-2.5 text-xs font-medium text-[#86efac] transition-colors hover:border-[#86efac]/35 hover:bg-[#86efac]/10 hover:text-[#f0fdf4]"
          >
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M19 12H5m7-7-7 7 7 7" />
            </svg>
            Back to projects
          </a>
        </nav>

        <span
          class="text-[10px] font-medium uppercase tracking-[2.5px] text-[#86efac]/65"
        >
          The everyday collection / 02
        </span>
      </header>

      <div class="flex flex-1 items-center justify-center py-10">
        <div
          class="box-border h-[571px] w-[520px] rounded-[24px] border border-white/10 bg-[#192b22] p-[36px]"
        >
          <div
            class="flex h-[44px] w-[44px] items-center justify-center rounded-[12px] border border-[#4ade8026] bg-[#4ade8026]"
          >
            <img src="Frame.png" alt="lock" />
          </div>

          <div class="mt-[24px] h-[34px] text-[28px] text-[#f0fdf4]">
            Password generator
          </div>

          <div class="mt-[8px] text-[14px] text-[#a4b9ad]">
            A strong password. One click away.
          </div>

          <label
            for="password"
            class="mt-[32px] block text-[12px] text-[#a4b9ad]"
          >
            Your password
          </label>

          <div
            class="mt-[12px] flex h-[64px] w-full items-center justify-between rounded-[12px] border border-white/10 bg-[#101b16] py-0 pr-[12px] pl-[16px]"
          >
            <input
              id="password"
              type="text"
              value=""
              readonly
              aria-label="Generated password"
              class="h-full min-w-0 flex-1 bg-transparent text-[18px] text-[#bbf7d0] outline-none"
            />

            <button
              id="copy"
              type="button"
              class="ml-3 flex h-[31px] w-[55px] shrink-0 items-center justify-center rounded-[8px] border border-white/5 bg-white/5 text-[12px] text-[#dcece2] hover:bg-white/10"
            >
              Copy
            </button>
          </div>

          <div
            id="status"
            aria-live="polite"
            class="mt-[12px] min-h-[15px] text-[12px] text-[#a4b9ad]"
          >
            Uses letters, numbers, and symbols.
          </div>

          <div
            class="mt-[24px] flex h-[28px] w-full items-center justify-between"
          >
            <label for="length" class="text-[14px] text-[#dcece2]">
              Password length
            </label>

            <div id="length-value" class="text-[18px] text-[#86efac]">16</div>
          </div>

          <input
            id="length"
            type="range"
            min="8"
            max="24"
            value="16"
            class="mt-4 w-full cursor-pointer accent-[#4ade80]"
          />

          <div
            class="mt-[11px] flex h-[16px] w-full items-center justify-between text-[12px] text-[#8aa294]"
          >
            <span>8</span>
            <span>24</span>
          </div>

          <button
            id="generate"
            type="button"
            class="mt-[28px] flex h-[48px] w-full items-center justify-center rounded-[12px] border border-[#4ade80] bg-[#4ade80] text-[14px] font-semibold text-[#102418] transition-colors hover:bg-[#86efac]"
          >
            Generate password
          </button>

          <div
            class="mt-[20.5px] flex h-[16px] w-full justify-center text-[12px] font-normal text-[#8aa294]"
          >
            Generated in your browser. Never saved.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
